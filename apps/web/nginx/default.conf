# nginx in front of everything: serves the built SPA and forwards /api,
# /socket.io and /webhooks to the api container.

# Docker's internal DNS, so nginx finds "api" again if that container restarts.
resolver 127.0.0.11 valid=10s ipv6=off;

# WebSocket upgrade for Socket.IO.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Behind cloudflared the original scheme arrives in X-Forwarded-Proto.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

# HSTS only makes sense over HTTPS (the public tunnel); an empty value sends nothing.
map $forwarded_proto $hsts_header {
  https   "max-age=31536000; includeSubDomains";
  default "";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Attachments up to 25 MB per email plus multipart overhead.
  client_max_body_size 30m;

  # Trust the client IP that cloudflared (or Docker's port proxy) forwards,
  # but only from private Docker networks, so the API sees the real address.
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # A variable in proxy_pass makes nginx resolve "api" per request via the resolver above.
  set $api_upstream http://api:3000;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $api_upstream;
  }

  location /webhooks/ {
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $api_upstream;
  }

  location /socket.io/ {
    include /etc/nginx/snippets/proxy.conf;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_pass $api_upstream;
  }

  # Hashed build files never change: cache them for a year.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # nginx's built-in types don't know .webmanifest; app stores and PWA tools expect this one.
  location = /manifest.webmanifest {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    types { }
    default_type application/manifest+json;
    try_files $uri =404;
  }

  # Everything else is the SPA. index.html is never cached, so new builds show up at once.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
